<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>WebToApp Multi-File Test</title>  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head><body>  <main class="container"><h1>WebToApp Multi-File Test</h1>

<p>
  This test uses separate HTML, CSS, JavaScript,
  Manifest and Service Worker files.
</p>

<section class="card">

  <h2>JavaScript Test</h2>

  <button id="jsButton">
    Run JavaScript Test
  </button>

  <div id="jsResult" class="result"></div>

</section>

<section class="card">

  <h2>LocalStorage Test</h2>

  <input
    id="nameInput"
    type="text"
    placeholder="Type a name"
  >

  <div class="buttons">

    <button id="saveButton">
      Save
    </button>

    <button id="readButton">
      Read
    </button>

  </div>

  <div id="storageResult" class="result"></div>

</section>

<section class="card">

  <h2>Service Worker Test</h2>

  <div id="swResult" class="result">
    Checking...
  </div>

</section>

  </main>  <script src="app.js"></script></body>
</html>
