<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebToApp Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }

    input,
    button {
      font-size: 16px;
      padding: 10px;
      margin: 6px;
      border-radius: 8px;
    }

    button {
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      min-height: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>WebToApp Test</h1>

  <p>
    This page tests JavaScript and LocalStorage.
  </p>


  <!-- JavaScript Test -->

  <div class="box">

    <h2>1. JavaScript Test</h2>

    <button onclick="testJavaScript()">
      Run JavaScript Test
    </button>

    <div id="jsResult" class="result"></div>

  </div>


  <!-- LocalStorage Test -->

  <div class="box">

    <h2>2. LocalStorage Test</h2>

    <input
      id="nameInput"
      type="text"
      placeholder="Type a name"
    >

    <br>

    <button onclick="saveName()">
      Save
    </button>

    <button onclick="readName()">
      Read
    </button>

    <div id="storageResult" class="result"></div>

  </div>


  <script>

    function testJavaScript() {

      document.getElementById("jsResult").textContent =
        "JavaScript is working ✓";

    }


    function saveName() {

      const name =
        document.getElementById("nameInput").value.trim();

      if (!name) {

        document.getElementById("storageResult").textContent =
          "Enter a name first.";

        return;
      }

      localStorage.setItem(
        "webToAppTestName",
        name
      );

      document.getElementById("storageResult").textContent =
        "Saved ✓";

    }


    function readName() {

      const name =
        localStorage.getItem("webToAppTestName");

      if (name) {

        document.getElementById("storageResult").textContent =
          "Stored name: " + name + " ✓";

      } else {

        document.getElementById("storageResult").textContent =
          "No saved name found.";

      }

    }

  </script>

</body>
</html>
